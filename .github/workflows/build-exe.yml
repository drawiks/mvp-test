name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka zstandard

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build manta_cli.exe
        shell: bash
        run: |
          git clone https://github.com/drawiks/manta-cli.git manta-cli
          cd manta-cli
          git checkout 0434634
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H windowsgui" -o manta_cli.exe .
          cp manta_cli.exe ../manta_cli.exe

      - name: Build EXE with Nuitka
        shell: bash
        run: |
          python -m nuitka \
            --mode=standalone \
            --enable-plugin=pyqt6 \
            --windows-console-mode=disable \
            --assume-yes-for-downloads \
            --include-data-files=manta_cli.exe=manta_cli.exe \
            --include-data-dir=assets=assets \
            --output-filename=MVP_Calculator.exe \
            --output-folder-name=MVP_Calculator \
            --output-dir=dist \
            mvp/__main__.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MVP_Calculator-windows
          path: dist/MVP_Calculator.dist
