name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka zstandard

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build manta_cli.exe
        shell: bash
        run: |
          git clone https://github.com/drawiks/manta-cli.git manta-cli
          cd manta-cli
          git checkout 0434634
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o manta_cli.exe .
          cp manta_cli.exe ../manta_cli.exe

      - name: Build EXE with Nuitka
        shell: bash
        run: |
          python -m nuitka \
            --mode=onefile \
            --enable-plugin=pyqt6 \
            --windows-console-mode=disable \
            --assume-yes-for-downloads \
            --include-data-files=manta_cli.exe=manta_cli.exe \
            --include-data-files=assets/=assets/ \
            --output-filename=MVP_Calculator.exe \
            --output-dir=dist \
            mvp/__main__.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MVP_Calculator-windows
          path: dist/MVP_Calculator.exe

      - name: Determine next release version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "RELEASE_VERSION=v0.1.0" >> "$GITHUB_ENV"
          else
            minor=${prev#v0.}
            minor=${minor%.0}
            echo "RELEASE_VERSION=v0.$((minor + 1)).0" >> "$GITHUB_ENV"
          fi
          echo "next release: $RELEASE_VERSION"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_VERSION" \
            "dist/MVP_Calculator.exe#MVP_Calculator-windows-$RELEASE_VERSION.exe" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_VERSION" \
            --notes-file README.md
