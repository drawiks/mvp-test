name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build Windows exe
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart("v")
          wails build -platform windows/amd64 -clean -o mvp.exe -ldflags "-X main.version=$version"
          Copy-Item build/bin/mvp.exe mvp-windows-amd64.exe
          (Get-FileHash mvp-windows-amd64.exe -Algorithm SHA256).Hash.ToLower() + "  mvp-windows-amd64.exe" | Out-File -Encoding ascii checksums.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" mvp-windows-amd64.exe checksums.txt --title "${{ github.ref_name }}" --generate-notes
