name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build Windows exe
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          wails build -platform windows/amd64 -clean -o mvp.exe -ldflags "-X main.version=${VERSION}"
          cp build/bin/mvp.exe mvp-windows-amd64.exe
          sha256sum mvp-windows-amd64.exe > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" mvp-windows-amd64.exe checksums.txt --title "$GITHUB_REF_NAME" --generate-notes
